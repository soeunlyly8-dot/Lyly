<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>krama&spice</title>

    <!-- Include Google Fonts including Playfair Display and Cinzel for a more majestic, cultural look -->

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Include FontAwesome for icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

   

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }



        body {

            font-family: 'Poppins', sans-serif;

            color: #2b2b2b;

            min-height: 100vh;

            position: relative;

          background-image: url('khmer.jpg');

          background-position: center;

          background-size: cover;

        }



        header {

            padding: 20px 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #df1d1d;

            gap: 30px;

            flex-wrap: wrap;

            border-radius: 20px;

            margin: 20px auto;

            max-width: 95%;

            box-shadow: 0 10px 25px rgba(223, 29, 29, 0.25);

            position: sticky;

            top: 15px;

            z-index: 1000;

        }



        header nav {

            display: flex;

            align-items: center;

            justify-content: space-between;

            width: 100%;

            flex-wrap: wrap;

        }



        .logo-area {

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

        }



        .logo-area i {

            background-color: #ffffff;

            color: #df1d1d;

            padding: 10px;

            border-radius: 12px;

            font-size: 20px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);

        }



        header h1 {

            font-family: 'Pacifico', cursive;

            color: #ffffff;

            font-size: 26px;

            font-weight: 400;

            letter-spacing: 0.5px;

        }



        .nav-links {

            display: flex;

            align-items: center;

            gap: 25px;

        }



        header nav a {

            color: #ffcccc;

            text-decoration: none;

            font-weight: 500;

            font-size: 15px;

            transition: color 0.3s ease, transform 0.3s ease;

            position: relative;

            padding-bottom: 4px;

        }



        header nav a::after {

            content: '';

            position: absolute;

            left: 0;

            bottom: 0;

            width: 0;

            height: 2px;

            background-color: #ffffff;

            transition: width 0.3s ease;

        }



        header nav a:hover {

            color: #ffffff;

            transform: translateY(-2px);

        }



        header nav a:hover::after {

            width: 100%;

        }



        .book-btn {

            background-color: #ffffff;

            color: #df1d1d !important;

            padding: 8px 18px;

            border-radius: 50px;

            font-weight: 600 !important;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);

            transition: all 0.3s ease !important;

        }



        .book-btn::after {

            display: none !important;

        }



        .book-btn:hover {

            background-color: #ffcccc;

            transform: translateY(-3px) scale(1.02) !important;

            box-shadow: 0 6px 20px rgba(0,0,0,0.2);

        }



        .jake {

            padding: 50px;

            text-align: center;

            clear: both;

        }



        /* --- Komi Class Styles --- */

        .komi {

            background: rgba(255, 255, 255, 0.25);  

            backdrop-filter: blur(12px);                

            -webkit-backdrop-filter: blur(12px);        

            border: 1px solid rgba(255, 255, 255, 0.4);

            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);

            border-radius: 20px;                        

            padding: 20px 25px;                        

            max-width: 480px;                          

            margin: 40px 0 20px 3%;                    

            display: inline-block;                      

            float: left;                                

        }



        .komi P {

            color: #ffffff;                            

            font-family: 'Poppins', sans-serif;

            font-size: 14px;                            

            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            line-height: 1.4;

            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);  

        }



        /* --- Koja Class Styles with Enhanced Elegant Fonts --- */

        .koja {

            clear: both;

            float: left;

            margin-left: 3%;

            margin-top: 10px;

            max-width: 700px;

        }



        .koja h1 {

            color: #ffffff;

            font-family: 'Cinzel', serif;

            font-size: 44px;

            font-weight: 700;

            line-height: 1.25;

            text-shadow: 0 0 20px #df1d1d, 0 0 30px #df1d1d, 0 4px 8px rgba(0, 0, 0, 0.8);

            letter-spacing: 1px;

        }



        .koja h1 br {

            content: "";

            display: block;

            margin-bottom: 8px;

        }

    </style>

</head>

<body>

   <div class="bg-slide active" style="background-image: url('khmer.jpg');"></div>

            <div class="nav-links">

                <a href="menu.html">Menu</a>

                <a href="booktable.html" class="book-btn">Book a Table</a>

            </div>

    <div class="komi">

        <p>ENJOY MEALS WITH KHMER TRANDITIONAL FOOD</p>

    </div>



    <div class="koja">

        <h1>Authentic Flavors of CAMBODIA<br><span>A Taste of Khmer Heritage</span></h1>

    </div>



    <div class="jake">

        <h1></h1>

    </div>



    <!-- JavaScript to handle background switching every 3 seconds -->

    <script>

        const slides = document.querySelectorAll('.bg-slide');

        let currentSlide = 0;



        function changeBackground() {

            slides[currentSlide].classList.remove('active');

            currentSlide = (currentSlide + 1) % slides.length;

            slides[currentSlide].classList.add('active');

        }



        // 3000 milliseconds = 3 seconds

        setInterval(changeBackground, 3000);

    </script>

</body>

</html>
